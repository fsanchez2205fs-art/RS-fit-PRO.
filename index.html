<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS FIT PRO - Plataforma Cloud</title>

  <style>
    :root {
      --bg-primary: #121824;
      --bg-card: #1e2638;
      --accent: #ff4b4b;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: #2e3a52;
      --success: #10b981;
      --highlight: #38bdf8;
      --warning: #f59e0b;
      --tab-inactive: #171f30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; }
    .card { background-color: var(--bg-card); border-radius: 12px; padding: 15px; max-width: 650px; margin: 15px auto; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, textarea, select { background: var(--bg-primary); border: 1px solid var(--border-color); color: white; padding: 10px; width: 100%; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
    button { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: var(--accent); }
    .btn-secondary { background: var(--highlight); color: #121824; }
    .btn-video { background: var(--accent); color: white; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-weight: bold; }
    .hidden { display: none !important; }
    h2, h3, h4 { color: var(--highlight); margin-bottom: 10px; }

    /* Controles Superiores de Fase/Semana/Objetivo */
    .top-selectors { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 15px; max-width: 650px; margin-left: auto; margin-right: auto; }
    .selector-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); }
    .selector-row:last-child { margin-bottom: 0; }
    .selector-row select { width: 65%; margin-bottom: 0; padding: 6px; font-weight: bold; color: var(--highlight); }

    /* Pestañas de Días de la Semana */
    .days-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; max-width: 650px; margin-left: auto; margin-right: auto; }
    .day-tab { background: var(--tab-inactive); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .day-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .day-tab.nutrition-tab { background: #0e3b2e; color: #34d399; border-color: var(--success); }
    .day-tab.nutrition-tab.active { background: var(--success); color: white; }

    /* Tarjetas de Ejercicio Estilo Pro */
    .exercise-card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .series-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 8px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; }
    .series-row input[type="number"] { width: 60px; padding: 4px; text-align: center; margin-bottom: 0; background: var(--bg-primary); }
    .series-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--success); }
  </style>
</head>
<body>

  <!-- VISTA DE LOGIN -->
  <div id="login-view" class="card" style="margin-top: 50px;">
    <h2>Acceso Privado - RS Fit Pro</h2>
    <input type="email" id="login-email" placeholder="Correo electrónico">
    <input type="password" id="login-password" placeholder="Contraseña">
    <button onclick="loginUser()">Iniciar Sesión</button>
  </div>

  <!-- VISTA PRINCIPAL DE LA APLICACIÓN -->
  <div id="app-view" class="hidden">
    
    <!-- Header de Usuario y Salir -->
    <header style="display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 10px auto; background: var(--bg-card); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border-color);">
      <h1 id="welcome-title" style="font-size: 1rem; color: var(--highlight);">RS FIT PRO</h1>
      <button onclick="logoutUser()" class="btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.75rem;">Cerrar Sesión</button>
    </header>

    <!-- SELECTORES SUPERIORES (Fase, Semana, Objetivo) -->
    <div class="top-selectors">
      <div class="selector-row">
        <span>Fase:</span>
        <select id="sel-fase">
          <option>Fase 1 (Adaptación)</option>
          <option selected>Fase 2 (Volumen)</option>
          <option>Fase 3 (Definición)</option>
        </select>
      </div>
      <div class="selector-row">
        <span>Semana:</span>
        <select id="sel-semana">
          <option selected>Semana 1</option>
          <option>Semana 2</option>
          <option>Semana 3</option>
          <option>Semana 4</option>
        </select>
      </div>
      <div class="selector-row">
        <span>Objetivo:</span>
        <select id="sel-objetivo">
          <option>Fuerza Máxima</option>
          <option selected>Definición / Pérdida Grasa</option>
          <option>Hipertrofia Pura</option>
        </select>
      </div>
    </div>

    <!-- TARJETA DE BIENVENIDA Y RETO DIARIO -->
    <div class="card" style="text-align: center; padding: 12px;">
      <p id="daily-greeting" style="font-size: 0.95rem; font-weight: bold; color: var(--highlight); margin-bottom: 4px;">¡Hola, Atleta! Tu reto para hoy:</p>
      <p id="daily-date" style="font-size: 0.8rem; color: var(--text-muted);">Sincronizando fecha...</p>
    </div>

    <!-- NAVEGACIÓN POR PESTAÑAS (DÍAS + NUTRICIÓN) -->
    <div class="days-nav">
      <button class="day-tab" onclick="switchDay('LUNES')" id="tab-LUNES">LUNES</button>
      <button class="day-tab" onclick="switchDay('MARTES')" id="tab-MARTES">MARTES</button>
      <button class="day-tab" onclick="switchDay('MIERCOLES')" id="tab-MIERCOLES">MIÉRCOLES</button>
      <button class="day-tab" onclick="switchDay('JUEVES')" id="tab-JUEVES">JUEVES</button>
      <button class="day-tab" onclick="switchDay('VIERNES')" id="tab-VIERNES">VIERNES</button>
      <button class="day-tab nutrition-tab" onclick="switchDay('NUTRICION')" id="tab-NUTRICION">🥗 NUTRICIÓN</button>
    </div>

    <!-- CONTENEDOR DINÁMICO DE CONTENIDO DIARIO / NUTRICIÓN -->
    <div id="day-content-container">
      <!-- Se carga dinámicamente según la pestaña seleccionada -->
    </div>

    <!-- ZONA EXCLUSIVA DE ENTRENADOR (COACH PANEL) -->
    <div id="coach-dashboard" class="card hidden">
      <h3>Panel de Control - Entrenador</h3>
      <button onclick="toggleAthleteForm()" class="btn-secondary" style="margin-bottom: 10px;">+ Registrar Nuevo Atleta</button>

      <div id="new-athlete-form" class="hidden" style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px;">
        <h4 style="color: var(--success); font-size: 0.9rem;">Nuevo Atleta</h4>
        <input type="text" id="new-athlete-name" placeholder="Nombre">
        <input type="email" id="new-athlete-email" placeholder="Correo">
        <input type="password" id="new-athlete-password" placeholder="Contraseña provisional">
        <button onclick="registerNewAthlete()">Registrar en la Nube</button>
      </div>

      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px;">Tus Atletas Registrados:</p>
      <div id="athletes-list"></div>
      
      <!-- Panel de edición para el coach -->
      <div id="coach-edit-section" class="hidden" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <h4 id="coach-editing-target" style="font-size: 0.95rem; color: var(--success);">Editando Plan para: </h4>
        <textarea id="coach-routine-input" rows="4" placeholder="Formato:\nLUNES | Sentadilla | 3x10 | https://youtube.com/...\nMARTES | Press | 3x10 | https://youtube.com/..."></textarea>
        <button onclick="saveCoachRoutine()">Guardar Rutina en Firestore</button>
      </div>
    </div>

  </div>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyClD42rhr2RwnqPyaqEzi-M3OtwKgnkvpU",
      authDomain: "rsfitpro-ac539.firebaseapp.com",
      projectId: "rsfitpro-ac539",
      storageBucket: "rsfitpro-ac539.firebasestorage.app",
      messagingSenderId: "323823367845",
      appId: "1:323823367845:web:bdde2929003b6443817f4c",
      measurementId: "G-M3NKJLNB2B"
    };

    const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
    const secondaryAuth = firebase.auth(secondaryApp);

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUserRole = 'athlete';
    let currentAthleteData = {};
    let activeDay = 'LUNES';
    let selectedCoachAthleteId = null;

    // Sincronizar fecha real y saludo automático al cargar
    function initDateAndGreeting(userName) {
      const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const now = new Date();
      const nombreDia = dias[now.getDay()];
      const numeroDia = now.getDate();
      const nombreMes = meses[now.getMonth()];
      const anio = now.getFullYear();

      document.getElementById('daily-greeting').innerText = `¡Hola, ${userName}! Tu reto para hoy:`;
      document.getElementById('daily-date').innerText = `Fecha: ${nombreDia}, ${numeroDia} De ${nombreMes} De ${anio}`;

      // Detectar automáticamente el día de la semana actual para seleccionarlo en las pestañas
      const mapDay = ['DOMINGO', 'LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO'];
      const todayKey = mapDay[now.getDay()];
      if (['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES'].includes(todayKey)) {
        activeDay = todayKey;
      } else {
        activeDay = 'LUNES'; // Por defecto si es fin de semana
      }
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');

        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            const userData = userDoc.data();
            currentUserRole = userData.role || 'athlete';
            initDateAndGreeting(userData.name);

            if (currentUserRole === 'coach') {
              document.getElementById('coach-dashboard').classList.remove('hidden');
              loadCoachAthletesList();
            } else {
              // Cargar datos del atleta
              const workoutDoc = await db.collection('workouts').doc(user.uid).get();
              if (workoutDoc.exists) {
                currentAthleteData = workoutDoc.data();
              }
              renderActiveDayView();
            }
          }
        } catch (e) {
          console.error("Error al cargar perfil:", e);
        }
      } else {
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      }
    });

    function loginUser() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(err => alert("Error de acceso: " + err.message));
    }

    function logoutUser() {
      auth.signOut();
    }

    // Cambiar de pestaña (Días o Nutrición)
    function switchDay(day) {
      activeDay = day;
      renderActiveDayView();
    }

    // Renderizar la vista según el día activo
    function renderActiveDayView() {
      // Actualizar estilos visuales de las pestañas
      ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'NUTRICION'].forEach(d => {
        const btn = document.getElementById(`tab-${d}`);
        if (btn) {
          if (d === activeDay) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });

      const container = document.getElementById('day-content-container');

      if (activeDay === 'NUTRICION') {
        renderNutritionView(container);
        return;
      }

      if (activeDay === 'MIERCOLES') {
        renderMetricsView(container);
        return;
      }

      // Renderizar entrenamiento del día correspondiente
      renderWorkoutView(container, activeDay);
    }

    // Mostrar bloques de entrenamiento filtrados por día
    function renderWorkoutView(container, dayName) {
      const routineRaw = currentAthleteData.routine || "";
      const lines = routineRaw.split('\n');
      let html = `<h3 style="font-size: 0.95rem; margin-bottom: 10px; color: var(--highlight);">🏋️‍♂️ Entrenamiento: ${dayName}</h3>`;
      
      let exercisesFound = false;

      lines.forEach(line => {
        if (!line.trim()) return;
        // Formato esperado en rutina: DIA | Ejercicio | Series/Reps | LinkYouTube
        const parts = line.split('|').map(p => p.trim());
        
        // Si el entrenador especificó el día al principio (ej: LUNES | Sentadilla...)
        const assignedDay = parts.length > 3 ? parts[0].toUpperCase() : 'LUNES';
        const exName = parts.length > 3 ? parts[1] : (parts[0] || "Ejercicio");
        const exObj = parts.length > 3 ? parts[2] : (parts[1] || "3 series | 10-12 reps");
        const exLink = parts.find(p => p.includes('http')) || "";

        // Si coincide con el día activo (o si no se especificó día estricto, mostrar en Lunes)
        if (assignedDay === dayName || parts.length <= 3) {
          exercisesFound = true;
          html += `
            <div class="exercise-card">
              <div class="exercise-header">
                <strong style="font-size: 0.95rem; color: var(--text-main);">${exName}</strong>
                ${exLink ? `<a href="${exLink}" target="_blank" class="btn-video">▶ Vídeo</a>` : ''}
              </div>
              <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Objetivo: ${exObj}</p>
              
              <div class="series-row">
                <span>Serie 1</span>
                <span>Kg: <input type="number" value="40"></span>
                <span>Reps: <input type="number" value="12"></span>
                <input type="checkbox">
              </div>
              <div class="series-row">
                <span>Serie 2</span>
                <span>Kg: <input type="number" value="40"></span>
                <span>Reps: <input type="number" value="12"></span>
                <input type="checkbox">
              </div>
              <div class="series-row">
                <span>Serie 3</span>
                <span>Kg: <input type="number" value="40"></span>
                <span>Reps: <input type="number" value="12"></span>
                <input type="checkbox">
              </div>
            </div>
          `;
        }
      });

      if (!exercisesFound) {
        html += `<div class="card"><p style="color: var(--text-muted); text-align: center;">No hay ejercicios programados para este día. Tu entrenador puede añadirlos desde su panel.</p></div>`;
      }

      container.innerHTML = html;
    }

    // Miércoles: Día de descanso y métricas corporales
    function renderMetricsView(container) {
      container.innerHTML = `
        <div class="card" style="border-color: var(--warning);">
          <h3 style="color: var(--warning); margin-bottom: 8px;">🧘‍♂️ Miércoles: Día de Descanso & Métricas</h3>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Hoy toca recuperación activa y registro de tus progresos corporales.</p>
          
          <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
            <label style="font-size: 0.85rem; display: block; margin-bottom: 5px;">Peso Actual (kg):</label>
            <input type="number" placeholder="Ej: 74.5" style="margin-bottom: 10px;">
            
            <label style="font-size: 0.85rem; display: block; margin-bottom: 5px;">Porcentaje de Grasa Corporal (%):</label>
            <input type="number" placeholder="Ej: 15.2" style="margin-bottom: 10px;">
            
            <button class="btn-secondary" onclick="alert('¡Métricas guardadas correctamente en tu historial!')">Guardar Métricas de la Semana</button>
          </div>
        </div>
      `;
    }

    // Pestaña de Nutrición y Lista de la Compra Imprimible en PDF
    function renderNutritionView(container) {
      const nutritionText = currentAthleteData.nutrition || "Plan nutricional equilibrado adaptado a tus objetivos de volumen y definición.";
      
      container.innerHTML = `
        <div class="card" style="border-color: var(--success);">
          <h3 style="color: var(--success); margin-bottom: 10px;">🥗 Plan Semanal de Alimentación</h3>
          <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; font-size: 0.85rem; white-space: pre-line;">
            ${nutritionText}
          </div>

          <h4 style="font-size: 0.9rem; color: var(--highlight); margin-bottom: 8px;">🛒 Lista de la Compra Semanal</h4>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Genera tu lista de ingredientes limpia y lista para imprimir o llevar en PDF.</p>
          <button onclick="generateShoppingPDF()" style="background: var(--success); display: flex; align-items: center; justify-content: center; gap: 8px;">
            📄 Imprimir / Descargar Lista de la Compra (PDF)
          </button>
        </div>
      `;
    }

    // Generar ventana de impresión para la lista de la compra en PDF
    function generateShoppingPDF() {
      const nutritionText = currentAthleteData.nutrition || "Sin pauta nutricional especificada.";
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>RS FIT PRO - Lista de la Compra</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 30px; color: #111; }
              h1 { color: #10b981; border-bottom: 2px solid #10b981; padding-bottom: 10px; }
              .box { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px; white-space: pre-line; }
            </style>
          </head>
          <body>
            <h1>RS FIT PRO - Lista de la Compra & Pauta Nutricional</h1>
            <p><strong>Atleta:</strong> ${auth.currentUser.email}</p>
            <div class="box">${nutritionText}</div>
            <script>
              window.onload = function() { window.print(); }
            <\/script>
          </body>
        </html>
      `);
      printWindow.document.close();
    }

    // Funciones del Coach (Panel de Entrenador)
    async function loadCoachAthletesList() {
      const listContainer = document.getElementById('athletes-list');
      try {
        const snapshot = await db.collection('users').where('role', '==', 'athlete').get();
        if (snapshot.empty) {
          listContainer.innerHTML = "<p style='color:var(--text-muted); font-size:0.85rem;'>No hay atletas registrados.</p>";
          return;
        }
        let html = "<ul>";
        snapshot.forEach(doc => {
          const d = doc.data();
          html += `<li style="background:var(--bg-primary); padding:8px; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border-color);">
            <span style="font-size:0.85rem;"><strong>${d.name}</strong><br><small style="color:var(--text-muted);">${d.email}</small></span>
            <button onclick="selectAthleteToEdit('${doc.id}', '${d.name}')" style="width:auto; padding:5px 10px; font-size:0.75rem;">Editar Plan</button>
          </li>`;
        });
        html += "</ul>";
        listContainer.innerHTML = html;
      } catch (e) {
        listContainer.innerHTML = "<p style='color:var(--accent); font-size:0.85rem;'>Error al cargar lista.</p>";
      }
    }

    function toggleAthleteForm() {
      document.getElementById('new-athlete-form').classList.toggle('hidden');
    }

    async function registerNewAthlete() {
      const name = document.getElementById('new-athlete-name').value;
      const email = document.getElementById('new-athlete-email').value;
      const password = document.getElementById('new-athlete-password').value;

      if (!name || !email || !password) {
        alert("Completa todos los campos.");
        return;
      }

      try {
        const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({ name, email, role: 'athlete' });
        alert("¡Atleta registrado con éxito!");
        document.getElementById('new-athlete-name').value = '';
        document.getElementById('new-athlete-email').value = '';
        document.getElementById('new-athlete-password').value = '';
        toggleAthleteForm();
        loadCoachAthletesList();
      } catch (e) {
        alert("Error al registrar: " + e.message);
      }
    }

    function selectAthleteToEdit(id, name) {
      selectedCoachAthleteId = id;
      document.getElementById('coach-edit-section').classList.remove('hidden');
      document.getElementById('coach-editing-target').innerText = `Editando Plan para: ${name}`;
    }

    async function saveCoachRoutine() {
      const routineText = document.getElementById('coach-routine-input').value;
      if (!selectedCoachAthleteId) return;
      try {
        await db.collection('workouts').doc(selectedCoachAthleteId).set({ routine: routineText }, { merge: true });
        alert("¡Rutina guardada y sincronizada con éxito!");
      } catch (e) {
        alert("Error al guardar rutina: " + e.message);
      }
    }
  </script>
</body>
</html>
