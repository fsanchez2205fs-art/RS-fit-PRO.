<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS FIT PRO - Plataforma Cloud</title>

  <style>
    :root {
      --bg-primary: #121824;
      --bg-card: #1e2638;
      --accent: #ff4b4b;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: #2e3a52;
      --success: #10b981;
      --highlight: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; }
    .card { background-color: var(--bg-card); border-radius: 12px; padding: 20px; max-width: 600px; margin: 40px auto; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, textarea { background: var(--bg-primary); border: 1px solid var(--border-color); color: white; padding: 12px; width: 100%; border-radius: 6px; margin-bottom: 12px; }
    button { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: var(--accent); }
    .btn-secondary { background: var(--highlight); color: #121824; margin-bottom: 15px; }
    .btn-back { background: var(--border-color); color: white; margin-bottom: 15px; }
    .hidden { display: none !important; }
    h2, h3, h4 { color: var(--highlight); margin-bottom: 15px; }
    ul { list-style: none; }
    li { background: var(--bg-primary); padding: 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- VISTA DE LOGIN -->
  <div id="login-view" class="card">
    <h2>Acceso Privado - RS Fit Pro</h2>
    <input type="email" id="login-email" placeholder="Correo electrónico">
    <input type="password" id="login-password" placeholder="Contraseña">
    <button onclick="loginUser()">Iniciar Sesión</button>
  </div>

  <!-- VISTA PRINCIPAL (Panel de Usuario) -->
  <div id="app-view" class="hidden">
    <header style="display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px auto; background: var(--bg-card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color);">
      <h1 id="welcome-title" style="font-size: 1.2rem; color: var(--highlight);">Panel</h1>
      <button onclick="logoutUser()" class="btn-danger" style="width: auto; padding: 8px 16px; font-size: 0.85rem;">Cerrar Sesión</button>
    </header>

    <!-- ZONA DE ATLETA -->
    <div id="athlete-dashboard" class="card hidden" style="max-width: 800px;">
      <h3>Tu Plan de Entrenamiento Asignado</h3>
      <div id="athlete-workout-content">
        <p style="color: var(--text-muted); margin-bottom: 15px;">Cargando tus rutinas...</p>
      </div>
    </div>

    <!-- ZONA DE ENTRENADOR (COACH) -->
    <div id="coach-dashboard" class="card hidden" style="max-width: 800px;">
      
      <!-- Sub-vista 1: Lista general -->
      <div id="coach-main-view">
        <h3>Panel de Control - Entrenador</h3>
        <button onclick="toggleAthleteForm()" class="btn-secondary" id="btn-toggle-form">+ Registrar Nuevo Atleta</button>

        <div id="new-athlete-form" class="hidden" style="background: var(--bg-primary); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px;">
          <h4 style="color: var(--success); margin-bottom: 10px;">Nuevo Atleta</h4>
          <input type="text" id="new-athlete-name" placeholder="Nombre del Atleta">
          <input type="email" id="new-athlete-email" placeholder="Correo electrónico">
          <input type="password" id="new-athlete-password" placeholder="Contraseña provisional">
          <button onclick="registerNewAthlete()">Guardar y Registrar Atleta</button>
        </div>

        <p style="color: var(--text-muted); margin-bottom: 15px;">Lista de tus atletas registrados en la plataforma:</p>
        <div id="athletes-list"></div>
      </div>

      <!-- Sub-vista 2: Gestión de un Atleta Específico (Al hacer clic en Ver Plan) -->
      <div id="coach-athlete-detail-view" class="hidden">
        <button onclick="backToCoachMain()" class="btn-back" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">← Volver a la lista</button>
        <h3 id="detail-athlete-name" style="margin-top: 10px;">Gestión de Atleta</h3>
        
        <div style="background: var(--bg-primary); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px;">
          <h4 style="color: var(--success); font-size: 1rem; margin-bottom: 8px;">Rutina Asignada Actual</h4>
          <p id="current-workout-display" style="font-size: 0.9rem; color: var(--text-muted); white-space: pre-line;">Sin rutina asignada todavía.</p>
        </div>

        <h4 style="font-size: 0.95rem; margin-bottom: 8px;">Actualizar / Asignar Nueva Rutina</h4>
        <textarea id="new-workout-text" rows="4" placeholder="Escribe aquí los detalles de la rutina (ej. Lunes: Tren Superior, etc.)"></textarea>
        <button onclick="saveAthleteWorkout()">Guardar Rutina para este Atleta</button>
      </div>

    </div>
  </div>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyClD42rhr2RwnqPyaqEzi-M3OtwKgnkvpU",
      authDomain: "rsfitpro-ac539.firebaseapp.com",
      projectId: "rsfitpro-ac539",
      storageBucket: "rsfitpro-ac539.firebasestorage.app",
      messagingSenderId: "323823367845",
      appId: "1:323823367845:web:bdde2929003b6443817f4c",
      measurementId: "G-M3NKJLNB2B"
    };

    const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
    const secondaryAuth = firebase.auth(secondaryApp);

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let selectedAthleteId = null;

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');

        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          
          if (userDoc.exists) {
            const userData = userDoc.data();
            document.getElementById('welcome-title').innerText = `Bienvenido, ${userData.name}`;

            if (userData.role === 'coach') {
              document.getElementById('coach-dashboard').classList.remove('hidden');
              loadCoachPanel();
            } else {
              document.getElementById('athlete-dashboard').classList.remove('hidden');
              loadAthletePanel(user.uid);
            }
          }
        } catch (error) {
          console.error("Error al cargar el perfil:", error);
        }

      } else {
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      }
    });

    function loginUser() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(error => alert("Error al iniciar sesión: " + error.message));
    }

    function logoutUser() {
      auth.signOut();
    }

    // Cargar panel de atleta (lee su rutina personalizada de Firestore)
    async function loadAthletePanel(uid) {
      const container = document.getElementById('athlete-workout-content');
      try {
        const doc = await db.collection('workouts').doc(uid).get();
        if (doc.exists && doc.data().routine) {
          container.innerHTML = `<div style="background: var(--bg-primary); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
            <p style="font-size: 0.95rem; color: var(--text-main); white-space: pre-line;">${doc.data().routine}</p>
          </div>`;
        } else {
          container.innerHTML = `<p style="color: var(--text-muted);">Tu entrenador aún no ha publicado rutinas para ti.</p>`;
        }
      } catch (error) {
        container.innerHTML = `<p style="color: var(--accent);">Error al cargar tu plan.</p>`;
      }
    }

    // Cargar lista de atletas para el coach
    async function loadCoachPanel() {
      const listContainer = document.getElementById('athletes-list');
      listContainer.innerHTML = "Cargando atletas...";

      try {
        const snapshot = await db.collection('users').where('role', '==', 'athlete').get();
        if (snapshot.empty) {
          listContainer.innerHTML = "<p style='color: var(--text-muted);'>No hay atletas registrados todavía en Firestore.</p>";
          return;
        }

        let html = "<ul>";
        snapshot.forEach(doc => {
          const data = doc.data();
          html += `<li>
                    <span><strong>${data.name}</strong> <br><small style="color:var(--text-muted);">${data.email}</small></span>
                    <button onclick="manageAthlete('${doc.id}', '${data.name}')" style="width: auto; padding: 6px 12px; font-size: 0.8rem;">Ver Plan</button>
                   </li>`;
        });
        html += "</ul>";
        listContainer.innerHTML = html;
      } catch (error) {
        listContainer.innerHTML = "<p style='color: var(--accent);'>Error al cargar la lista de atletas.</p>";
      }
    }

    function toggleAthleteForm() {
      const form = document.getElementById('new-athlete-form');
      form.classList.toggle('hidden');
    }

    async function registerNewAthlete() {
      const name = document.getElementById('new-athlete-name').value;
      const email = document.getElementById('new-athlete-email').value;
      const password = document.getElementById('new-athlete-password').value;

      if (!name || !email || !password) {
        alert("Por favor, completa todos los campos.");
        return;
      }

      try {
        const userCredential = await secondaryAuth.createUserWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

        await db.collection('users').doc(uid).set({
          name: name,
          email: email,
          role: 'athlete'
        });

        alert("¡Atleta registrado con éxito!");
        document.getElementById('new-athlete-name').value = '';
        document.getElementById('new-athlete-email').value = '';
        document.getElementById('new-athlete-password').value = '';
        toggleAthleteForm();
        loadCoachPanel();

      } catch (error) {
        alert("Error al registrar atleta: " + error.message);
      }
    }

    // Abrir la vista de gestión para un atleta concreto
    async function manageAthlete(athleteId, athleteName) {
      selectedAthleteId = athleteId;
      document.getElementById('detail-athlete-name').innerText = `Gestión de Plan: ${athleteName}`;
      
      document.getElementById('coach-main-view').classList.add('hidden');
      document.getElementById('coach-athlete-detail-view').classList.remove('hidden');

      // Cargar la rutina actual de este atleta si existe
      const display = document.getElementById('current-workout-display');
      display.innerText = "Cargando rutina...";
      
      try {
        const doc = await db.collection('workouts').doc(athleteId).get();
        if (doc.exists && doc.data().routine) {
          display.innerText = doc.data().routine;
        } else {
          display.innerText = "Sin rutina asignada todavía.";
        }
      } catch (error) {
        display.innerText = "Error al cargar la rutina.";
      }
    }

    function backToCoachMain() {
      selectedAthleteId = null;
      document.getElementById('coach-athlete-detail-view').classList.add('hidden');
      document.getElementById('coach-main-view').classList.remove('hidden');
      loadCoachPanel();
    }

    // Guardar la rutina en Firestore para ese atleta
    async function saveAthleteWorkout() {
      const routineText = document.getElementById('new-workout-text').value;
      if (!routineText) {
        alert("Escribe algo en la rutina antes de guardar.");
        return;
      }

      try {
        await db.collection('workouts').doc(selectedAthleteId).set({
          routine: routineText,
          updatedAt: new Date()
        });
        alert("¡Rutina guardada y asignada con éxito!");
        document.getElementById('current-workout-display').innerText = routineText;
        document.getElementById('new-workout-text').value = '';
      } catch (error) {
        alert("Error al guardar la rutina: " + error.message);
      }
    }
  </script>
</body>
</html>
